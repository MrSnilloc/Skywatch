<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<meta name="mobile-web-app-capable" content="yes">
<title>UpSight</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><img class="logo" src="icons/icon-192.png" alt=""><div><h1>UpSight</h1><div id="subtitle"></div></div></div>
    <button id="btn-settings" aria-label="Settings"></button>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
  <button id="fab" aria-label="What's this? Identify a light in the sky"><span class="ic">🛸</span>What’s this?</button>
</div>
<div id="sheet" class="sheet hidden"></div>

<!-- Libraries (kept local so the app works offline): astronomy-engine + satellite.js (MIT) and the NOAA World Magnetic Model via geomagnetism (Apache-2.0); see lib/THIRD-PARTY-LICENSES.txt -->
<script src="lib/astronomy.browser.min.js"></script>
<script src="lib/satellite.min.js"></script>
<script src="lib/geomagnetism.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
